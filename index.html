<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KF-Maniacs</title>
  <link rel="icon" href="kf-maniacs-logo.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #f3ead8;
      font: 18px/1.5 "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
    }
    .langs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.35rem 1rem;
      padding: 1rem 1rem 0;
    }
    .langs button {
      appearance: none;
      background: none;
      border: 0;
      padding: 0;
      color: #7a7366;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .langs button:hover { color: #f3ead8; }
    .langs button[aria-current="true"] {
      color: #f3ead8;
      text-decoration: underline;
      text-underline-offset: 0.25em;
    }
    main {
      width: min(36rem, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0 3rem;
      text-align: center;
    }
    img.logo {
      display: block;
      width: min(100%, 34rem);
      height: auto;
      margin: 0 auto 1.75rem;
    }
    p { margin: 0 0 1rem; }
    .muted {
      color: #b9b09c;
      font-size: 0.95rem;
    }
    ol {
      margin: 1.25rem 0 1.75rem;
      padding: 0 0 0 1.2rem;
      text-align: left;
    }
    li { margin: 0.35rem 0; }
    a.dl {
      display: inline-block;
      padding: 0.7rem 1.25rem;
      border: 1px solid #f3ead8;
      color: #000;
      background: #f3ead8;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    a.dl:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <nav class="langs" aria-label="Language">
    <button type="button" data-lang="en">English</button>
    <button type="button" data-lang="ru">Русский</button>
    <button type="button" data-lang="zh">简体中文</button>
    <button type="button" data-lang="es">Español</button>
    <button type="button" data-lang="pt">Português</button>
  </nav>
  <main>
    <img class="logo" src="kf-maniacs-logo.png" width="512" height="128" alt="KF-Maniacs">
    <p data-i18n="intro"></p>
    <ol>
      <li data-i18n="step1"></li>
      <li data-i18n="step2"></li>
      <li data-i18n="step3"></li>
      <li data-i18n="step4"></li>
    </ol>
    <p><a class="dl" href="KFM-Companion.exe" download="KFM Companion.exe" data-i18n="download"></a></p>
    <p class="muted" data-i18n="note"></p>
  </main>
  <script>
    const I18N = {
      ru: {
        intro: "KF-Maniacs — сообщество Killing Floor. Чтобы Steam сохранил статистику и ачивки после игры на нашем сервере, нужен KFM Companion.",
        step1: "Запустите Steam и войдите в аккаунт.",
        step2: "Скачайте и запустите KFM Companion.",
        step3: "Запустите Killing Floor как обычно.",
        step4: "Не закрывайте Companion, пока играете. Запись в Steam идёт после выхода из игры.",
        download: "Скачать KFM Companion",
        note: "Steam должен быть запущен."
      },
      en: {
        intro: "KF-Maniacs is a Killing Floor community. You need KFM Companion so Steam keeps your stats and achievements after you play on our server.",
        step1: "Start Steam and sign in.",
        step2: "Download and run KFM Companion.",
        step3: "Launch Killing Floor as usual.",
        step4: "Leave Companion running while you play. It writes to Steam after you quit the game.",
        download: "Download KFM Companion",
        note: "Steam must be running."
      },
      zh: {
        intro: "KF-Maniacs 是 Killing Floor 社区。要在我们的服务器上玩完后让 Steam 保存统计数据和成就，需要使用 KFM Companion。",
        step1: "启动 Steam 并登录账号。",
        step2: "下载并运行 KFM Companion。",
        step3: "照常启动 Killing Floor。",
        step4: "游戏期间请勿关闭 Companion。退出游戏后才会写入 Steam。",
        download: "下载 KFM Companion",
        note: "Steam 必须正在运行。"
      },
      es: {
        intro: "KF-Maniacs es una comunidad de Killing Floor. Necesitas KFM Companion para que Steam conserve tus estadísticas y logros después de jugar en nuestro servidor.",
        step1: "Abre Steam e inicia sesión.",
        step2: "Descarga y ejecuta KFM Companion.",
        step3: "Inicia Killing Floor como siempre.",
        step4: "No cierres Companion mientras juegas. Se guarda en Steam al salir del juego.",
        download: "Descargar KFM Companion",
        note: "Steam debe estar en ejecución."
      },
      pt: {
        intro: "KF-Maniacs é uma comunidade de Killing Floor. Você precisa do KFM Companion para o Steam guardar suas estatísticas e conquistas depois de jogar no nosso servidor.",
        step1: "Abra o Steam e entre na sua conta.",
        step2: "Baixe e execute o KFM Companion.",
        step3: "Inicie o Killing Floor normalmente.",
        step4: "Deixe o Companion aberto enquanto joga. Ele grava no Steam depois que você sair do jogo.",
        download: "Baixar KFM Companion",
        note: "O Steam precisa estar em execução."
      }
    };

    const langs = Object.keys(I18N);

    function browserLang() {
      const list = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || "en"];
      for (const raw of list) {
        const code = String(raw).toLowerCase();
        if (code.startsWith("ru")) return "ru";
        if (code.startsWith("zh")) return "zh";
        if (code.startsWith("es")) return "es";
        if (code.startsWith("pt")) return "pt";
        if (code.startsWith("en")) return "en";
      }
      return "en";
    }

    function apply(lang) {
      const pack = I18N[lang] || I18N.en;
      document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (pack[key]) el.textContent = pack[key];
      });
      document.querySelectorAll(".langs button").forEach((btn) => {
        btn.setAttribute("aria-current", btn.getAttribute("data-lang") === lang ? "true" : "false");
      });
    }

    const initial = langs.includes(localStorage.getItem("kfm-lang"))
      ? localStorage.getItem("kfm-lang")
      : browserLang();
    apply(initial);

    document.querySelector(".langs").addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-lang]");
      if (!btn) return;
      const lang = btn.getAttribute("data-lang");
      localStorage.setItem("kfm-lang", lang);
      apply(lang);
    });
  </script>
</body>
</html>
