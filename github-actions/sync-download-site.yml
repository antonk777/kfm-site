# Sync Companion onto the public Caddy site as soon as a GitHub Release is published.
name: Sync download site

on:
  release:
    types: [published, edited, prereleased, released]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest Companion onto VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.KFM_SITE_HOST }}
          username: ${{ secrets.KFM_SITE_USER }}
          key: ${{ secrets.KFM_SITE_DEPLOY_KEY }}
          # Forced command on the server ignores this and runs sync-now.sh.
          script: sync
